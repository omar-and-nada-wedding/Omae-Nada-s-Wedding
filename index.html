<!DOCTYPE html>
<html>

<head>

    <title>Omar & Nada - Wedding Invitation</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- ==================================================
         WEBSITE LINK PREVIEW / OPEN GRAPH
         ================================================== -->

    <meta
        property="og:title"
        content="Omar & Nada - Wedding Invitation"
    >

    <meta
        property="og:description"
        content="We are happy to invite you to celebrate our wedding."
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:site_name"
        content="Omar & Nada"
    >

    <meta
        property="og:url"
        content="https://omar-and-nada-wedding.github.io/Omar-Nada-s-Wedding/"
    >

    <meta
        property="og:image"
        content="https://omar-and-nada-wedding.github.io/Omar-Nada-s-Wedding/images/wedding-thumbnail.jpg"
    >

    <meta
        property="og:image:secure_url"
        content="https://omar-and-nada-wedding.github.io/Omar-Nada-s-Wedding/images/wedding-thumbnail.jpg"
    >

    <meta
        property="og:image:type"
        content="image/jpeg"
    >

    <meta
        property="og:image:width"
        content="1200"
    >

    <meta
        property="og:image:height"
        content="630"
    >

    <meta
        property="og:image:alt"
        content="Omar and Nada Wedding Invitation"
    >


    <!-- ==================================================
         TWITTER / X PREVIEW
         ================================================== -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Omar & Nada - Wedding Invitation"
    >

    <meta
        name="twitter:description"
        content="We are happy to invite you to celebrate our wedding."
    >

    <meta
        name="twitter:image"
        content="https://omar-and-nada-wedding.github.io/Omar-Nada-s-Wedding/images/wedding-thumbnail.jpg"
    >


    <link
        rel="canonical"
        href="https://omar-and-nada-wedding.github.io/Omar-Nada-s-Wedding/"
    >


    <style>

        /* ==================================================
           FONTS
           ================================================== */

        @font-face {
            font-family: "Dream Avenue";
            src: url("fonts/dream-avenue.woff") format("woff");
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: "Blastine";
            src: url("fonts/Blastine.woff") format("woff");
            font-weight: normal;
            font-style: normal;
        }


        /* ==================================================
           WHOLE PAGE
           ================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background-color: black;
            overflow-x: hidden;
        }


        /* ==================================================
           PAGE 1
           ================================================== */

        .page1 {
            position: relative;
            width: 100%;
            overflow: hidden;
        }


        /* ==================================================
           MAIN PHOTO
           ================================================== */

        .page1 > img:first-child {
            display: block;
            width: 100%;
            height: auto;
        }


        /* ==================================================
           ANIMATIONS
           ================================================== */

        @keyframes omarEnter {

            from {
                opacity: 0;

                transform: translate(
                    -80px,
                    -50%
                );
            }

            to {
                opacity: 1;

                transform: translate(
                    0,
                    -50%
                );
            }

        }


        @keyframes nadaEnter {

            from {
                opacity: 0;

                transform: translate(
                    80px,
                    -50%
                );
            }

            to {
                opacity: 1;

                transform: translate(
                    0,
                    -50%
                );
            }

        }


        @keyframes ampersandEnter {

            from {
                opacity: 0;

                transform: translate(
                    -50%,
                    calc(-50% - 80px)
                );
            }

            to {
                opacity: 1;

                transform: translate(
                    -50%,
                    -50%
                );
            }

        }


        @keyframes announcementReveal {

            from {
                opacity: 0;

                clip-path: inset(
                    0 100% 0 0
                );
            }

            to {
                opacity: 1;

                clip-path: inset(
                    0 0 0 0
                );
            }

        }


        @keyframes buttonEnter {

            from {
                opacity: 0;

                transform: translate(
                    calc(-50% - 80px),
                    -50%
                );
            }

            to {
                opacity: 1;

                transform: translate(
                    -50%,
                    -50%
                );
            }

        }


        /* ==================================================
           NAME STYLE
           ================================================== */

        .omar,
        .nada {
            position: absolute;

            margin: 0;

            color: white;

            font-family: "Dream Avenue", serif;
            font-weight: normal;

            line-height: 1;

            text-transform: uppercase;
        }


        /* ==================================================
           OMAR
           ================================================== */

        .omar {
            top: 44.5%;
            left: 22%;

            transform: translateY(-50%);

            font-size: clamp(
                58px,
                9vw,
                140px
            );

            animation:
                omarEnter
                1.5s
                ease-out
                0.4s
                both;
        }


        /* ==================================================
           AMPERSAND
           ================================================== */

        .ampersand {
            position: absolute;

            top: 48%;
            left: 49%;

            transform: translate(-50%, -50%);

            width: 7%;
            height: auto;

            animation:
                ampersandEnter
                1.5s
                ease-out
                0.4s
                both;
        }


        /* ==================================================
           NADA
           ================================================== */

        .nada {
            top: 53%;
            left: 50.5%;

            transform: translateY(-50%);

            font-size: clamp(
                58px,
                9vw,
                140px
            );

            animation:
                nadaEnter
                1.5s
                ease-out
                0.4s
                both;
        }


        /* ==================================================
           ANNOUNCEMENT
           ================================================== */

        .announcement {
            position: absolute;

            top: 64%;
            left: 14%;

            transform: translateY(-50%);

            width: 70%;

            color: white;

            text-align: left;

            font-family: "Blastine", cursive;
            font-weight: normal;

            font-size: clamp(
                58px,
                9vw,
                140px
            );

            white-space: nowrap;

            animation:
                announcementReveal
                2s
                ease-out
                1s
                both;
        }


        .announcement p {
            margin: 0;
        }


        /* ==================================================
           NEXT BUTTON
           ================================================== */

        .next-button {
            position: absolute;

            top: 82%;
            left: 80%;

            transform: translate(-50%, -50%);

            width: 5%;

            cursor: pointer;

            animation:
                buttonEnter
                2s
                ease-out
                1.5s
                both;
        }


        .next-button img {
            display: block;

            width: 100%;
            height: auto;
        }


        /* ==================================================
           OPEN OVERLAY
           ================================================== */

        .open-overlay {
            display: none;
        }


        /* ==================================================
           PHONE VERSION
           ================================================== */

        @media (max-width: 600px) {


            /* FULL SCREEN PHONE LAYOUT */

            html,
            body {
                margin: 0;
                padding: 0;

                width: 100%;
                height: 100%;

                background-color: black;
            }


            .page1 {
                position: relative;

                width: 100%;

                /*
                   Fill the whole visible phone screen.
                */

                height: 100dvh;

                overflow: hidden;

                background-color: black;
            }


            /* ==================================================
               FULL-SCREEN BACKGROUND PHOTO
               ================================================== */

            .page1 > img:first-child {
                position: absolute;

                inset: 0;

                width: 100%;
                height: 100%;

                display: block;

                object-fit: cover;

                /*
                   Change this later if you want
                   the crop moved left or right.
                */

                object-position: center center;
            }


            /* ==================================================
               MOBILE TEXT
               ================================================== */

            .omar {
                top: 44.5%;
                left: 22%;

                font-size: 9vw;
            }


            .ampersand {
                top: 48%;
                left: 49%;

                width: 7%;
            }


            .nada {
                top: 53%;
                left: 50.5%;

                font-size: 9vw;
            }


            .announcement {
                top: 64%;
                left: 14%;

                width: 70%;

                font-size: 9vw;
            }


            /* ==================================================
               MOBILE NEXT BUTTON
               ================================================== */

            .next-button {
                top: 86%;
                left: 84%;

                width: 8%;
            }


            /* ==================================================
               MOBILE TAP-TO-OPEN OVERLAY
               ================================================== */

            .open-overlay {
                position: fixed;

                inset: 0;

                z-index: 9999;

                display: flex;

                align-items: center;
                justify-content: center;

                width: 100%;
                height: 100dvh;

                background-color: white;

                opacity: 1;

                cursor: pointer;

                -webkit-tap-highlight-color: transparent;

                transition:
                    opacity
                    0.6s
                    ease;
            }


            .open-overlay-content {
                width: 90%;

                padding: 30px;

                text-align: center;
            }


            .open-overlay-text {
                margin: 0;

                color: #5a5b5e;

                font-family: "Dream Avenue", serif;
                font-weight: normal;

                font-size: 7vw;

                line-height: 1.35;

                letter-spacing: 0.08em;

                text-align: center;

                user-select: none;
                -webkit-user-select: none;
            }


            .open-overlay.hidden {
                opacity: 0;

                pointer-events: none;
            }

        }


        /* ==================================================
           EXTRA SMALL PHONES
           ================================================== */

        @media (max-width: 380px) {

            .omar,
            .nada {
                font-size: 8.7vw;
            }


            .announcement {
                font-size: 8.7vw;
            }


            .next-button {
                top: 86%;
                left: 84%;

                width: 9%;
            }


            .open-overlay-text {
                font-size: 6.5vw;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         MOBILE TAP-TO-OPEN OVERLAY
         ================================================== -->

    <div
        class="open-overlay"
        id="openOverlay"
        role="button"
        tabindex="0"
        aria-label="Tap to open the invitation"
    >

        <div class="open-overlay-content">

            <p class="open-overlay-text">
                Tap to Open the Invitation
            </p>

        </div>

    </div>


    <!-- ==================================================
         PAGE 1
         ================================================== -->

    <section
        class="page1"
        id="page1"
    >


        <!-- MAIN PHOTO -->

        <img
            src="images/couple.jpg"
            alt="Omar and Nada"
        >


        <!-- OMAR -->

        <h1 class="omar">
            OMAR
        </h1>


        <!-- AMPERSAND -->

        <img
            class="ampersand"
            src="images/ampersand.png"
            alt="&"
        >


        <!-- NADA -->

        <h1 class="nada">
            NADA
        </h1>


        <!-- ANNOUNCEMENT -->

        <div class="announcement">

            <p>
                We are Happy to Announce
            </p>

        </div>


        <!-- NEXT BUTTON -->

        <a
            href="page2.html"
            class="next-button"
        >

            <img
                src="images/next-button.png"
                alt="Continue to invitation"
            >

        </a>


    </section>


    <!-- ==================================================
         MUSIC
         ================================================== -->

    <audio
        id="weddingMusic"
        src="music/wedding-music.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- ==================================================
         JAVASCRIPT
         ================================================== -->

    <script>


        const weddingMusic =
            document.getElementById(
                "weddingMusic"
            );


        const openOverlay =
            document.getElementById(
                "openOverlay"
            );


        const nextButton =
            document.querySelector(
                ".next-button"
            );


        weddingMusic.volume = 0.7;


        /* ==================================================
           RESTORE MUSIC POSITION
           ================================================== */

        const savedMusicTime =
            sessionStorage.getItem(
                "weddingMusicTime"
            );


        weddingMusic.addEventListener(

            "loadedmetadata",

            function() {

                if (savedMusicTime !== null) {

                    const restoredTime =
                        parseFloat(
                            savedMusicTime
                        );


                    if (
                        Number.isFinite(
                            restoredTime
                        )
                    ) {

                        weddingMusic.currentTime =
                            restoredTime;

                    }

                }

            },

            {
                once: true
            }

        );


        /* ==================================================
           START MUSIC
           ================================================== */

        function startWeddingMusic() {

            return weddingMusic.play();

        }


        /* ==================================================
           DESKTOP AUTOPLAY
           ================================================== */

        if (
            window.matchMedia(
                "(min-width: 601px)"
            ).matches
        ) {

            startWeddingMusic().catch(

                function() {

                    /*
                       Browser requires interaction.
                    */

                }

            );

        }


        /* ==================================================
           MOBILE OPEN INVITATION
           ================================================== */

        let invitationIsOpening =
            false;


        function openInvitation() {


            if (invitationIsOpening) {

                return;

            }


            invitationIsOpening =
                true;


            const playRequest =
                startWeddingMusic();


            if (
                playRequest !== undefined
            ) {

                playRequest
                    .then(

                        function() {


                            sessionStorage.setItem(
                                "weddingMusicStarted",
                                "true"
                            );


                            openOverlay.classList.add(
                                "hidden"
                            );


                            setTimeout(

                                function() {

                                    openOverlay.style.display =
                                        "none";

                                },

                                650

                            );

                        }

                    )
                    .catch(

                        function(error) {


                            invitationIsOpening =
                                false;


                            console.log(
                                "Music start was blocked:",
                                error
                            );

                        }

                    );

            }

        }


        if (openOverlay) {

            openOverlay.addEventListener(
                "click",
                openInvitation
            );


            openOverlay.addEventListener(

                "keydown",

                function(event) {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {

                        event.preventDefault();

                        openInvitation();

                    }

                }

            );

        }


        /* ==================================================
           DESKTOP FALLBACK
           ================================================== */

        if (
            window.matchMedia(
                "(min-width: 601px)"
            ).matches
        ) {

            function desktopMusicUnlock() {

                startWeddingMusic()
                    .then(

                        function() {

                            document.removeEventListener(
                                "click",
                                desktopMusicUnlock
                            );

                        }

                    )
                    .catch(
                        function() {}
                    );

            }


            document.addEventListener(
                "click",
                desktopMusicUnlock
            );

        }


        /* ==================================================
           SAVE MUSIC POSITION
           ================================================== */

        setInterval(

            function() {

                if (
                    !weddingMusic.paused &&
                    Number.isFinite(
                        weddingMusic.currentTime
                    )
                ) {

                    sessionStorage.setItem(
                        "weddingMusicTime",
                        weddingMusic.currentTime
                    );

                }

            },

            200

        );


        /* ==================================================
           NEXT BUTTON
           ================================================== */

        if (nextButton) {

            nextButton.addEventListener(

                "click",

                function(event) {


                    event.preventDefault();


                    sessionStorage.setItem(
                        "weddingMusicTime",
                        weddingMusic.currentTime
                    );


                    window.location.href =
                        "page2.html";

                }

            );

        }


        /* ==================================================
           SAVE MUSIC WHEN LEAVING
           ================================================== */

        window.addEventListener(

            "pagehide",

            function() {

                if (
                    Number.isFinite(
                        weddingMusic.currentTime
                    )
                ) {

                    sessionStorage.setItem(
                        "weddingMusicTime",
                        weddingMusic.currentTime
                    );

                }

            }

        );


    </script>


</body>

</html>
