<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Omar & Nada - Wedding Invitation</title>


    <!-- ==================================================
         WEBSITE THUMBNAIL / LINK PREVIEW
         ================================================== -->

    <meta
        property="og:title"
        content="Omar & Nada - Wedding Invitation"
    >

    <meta
        property="og:description"
        content="We are happy to invite you to celebrate our wedding."
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:site_name"
        content="Omar & Nada"
    >

    <meta
        property="og:url"
        content="https://omar-and-nada-wedding.github.io/Omar-Nada-s-Wedding/"
    >

    <meta
        property="og:image"
        content="https://omar-and-nada-wedding.github.io/Omar-Nada-s-Wedding/images/wedding-thumbnail.jpg"
    >

    <meta
        property="og:image:secure_url"
        content="https://omar-and-nada-wedding.github.io/Omar-Nada-s-Wedding/images/wedding-thumbnail.jpg"
    >

    <meta
        property="og:image:type"
        content="image/jpeg"
    >

    <meta
        property="og:image:width"
        content="1200"
    >

    <meta
        property="og:image:height"
        content="630"
    >

    <meta
        property="og:image:alt"
        content="Omar and Nada Wedding Invitation"
    >


    <!-- TWITTER / X PREVIEW -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Omar & Nada - Wedding Invitation"
    >

    <meta
        name="twitter:description"
        content="We are happy to invite you to celebrate our wedding."
    >

    <meta
        name="twitter:image"
        content="https://omar-and-nada-wedding.github.io/Omar-Nada-s-Wedding/images/wedding-thumbnail.jpg"
    >


    <link
        rel="canonical"
        href="https://omar-and-nada-wedding.github.io/Omar-Nada-s-Wedding/"
    >


    <!-- ==================================================
         PRELOAD IMPORTANT PAGE 1 ASSETS
         ================================================== -->

    <link
        rel="preload"
        href="images/couple.jpg"
        as="image"
        fetchpriority="high"
    >

    <link
        rel="preload"
        href="fonts/dream-avenue.woff"
        as="font"
        type="font/woff"
        crossorigin
    >

    <link
        rel="preload"
        href="fonts/Blastine.woff"
        as="font"
        type="font/woff"
        crossorigin
    >

    <link
        rel="preload"
        href="music/wedding-music.mp3"
        as="audio"
        type="audio/mpeg"
    >


    <!-- PREPARE PAGE 2 -->

    <link
        rel="prefetch"
        href="page2.html"
    >


    <style>

        /* ==================================================
           FONTS
           ================================================== */

        @font-face {
            font-family: "Dream Avenue";
            src: url("fonts/dream-avenue.woff") format("woff");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }


        @font-face {
            font-family: "Blastine";
            src: url("fonts/Blastine.woff") format("woff");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }


        /* ==================================================
           RESET
           ================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;

            background-color: black;
        }


        body {
            overflow-x: hidden;
        }


        /* ==================================================
           PAGE 1
           ================================================== */

        .page1 {
            position: relative;

            width: 100%;

            overflow: hidden;
        }


        /* MAIN PHOTO */

        .page1 > .main-photo {
            display: block;

            width: 100%;
            height: auto;
        }


        /* ==================================================
           ANIMATIONS
           ================================================== */

        @keyframes omarEnter {

            from {
                opacity: 0;

                transform:
                    translate(-80px, -50%);
            }

            to {
                opacity: 1;

                transform:
                    translate(0, -50%);
            }

        }


        @keyframes nadaEnter {

            from {
                opacity: 0;

                transform:
                    translate(80px, -50%);
            }

            to {
                opacity: 1;

                transform:
                    translate(0, -50%);
            }

        }


        @keyframes ampersandEnter {

            from {
                opacity: 0;

                transform:
                    translate(
                        -50%,
                        calc(-50% - 80px)
                    );
            }

            to {
                opacity: 1;

                transform:
                    translate(-50%, -50%);
            }

        }


        @keyframes announcementReveal {

            from {
                opacity: 0;

                clip-path:
                    inset(0 100% 0 0);
            }

            to {
                opacity: 1;

                clip-path:
                    inset(0 0 0 0);
            }

        }


        @keyframes buttonEnter {

            from {
                opacity: 0;

                transform:
                    translate(
                        calc(-50% - 80px),
                        -50%
                    );
            }

            to {
                opacity: 1;

                transform:
                    translate(-50%, -50%);
            }

        }


        /* ==================================================
           OMAR + NADA
           ================================================== */

        .omar,
        .nada {
            position: absolute;

            margin: 0;

            color: white;

            font-family:
                "Dream Avenue",
                serif;

            font-weight: normal;

            line-height: 1;

            text-transform: uppercase;
        }


        .omar {
            top: 44.5%;
            left: 22%;

            transform:
                translateY(-50%);

            font-size:
                clamp(
                    58px,
                    9vw,
                    140px
                );

            animation:
                omarEnter
                1.5s
                ease-out
                0.4s
                both;
        }


        .nada {
            top: 53%;
            left: 50.5%;

            transform:
                translateY(-50%);

            font-size:
                clamp(
                    58px,
                    9vw,
                    140px
                );

            animation:
                nadaEnter
                1.5s
                ease-out
                0.4s
                both;
        }


        /* ==================================================
           AMPERSAND
           ================================================== */

        .ampersand {
            position: absolute;

            top: 48%;
            left: 49%;

            transform:
                translate(-50%, -50%);

            width: 7%;
            height: auto;

            animation:
                ampersandEnter
                1.5s
                ease-out
                0.4s
                both;
        }


        /* ==================================================
           ANNOUNCEMENT
           ================================================== */

        .announcement {
            position: absolute;

            top: 64%;
            left: 14%;

            transform:
                translateY(-50%);

            width: 70%;

            color: white;

            text-align: left;

            font-family:
                "Blastine",
                cursive;

            font-weight: normal;

            font-size:
                clamp(
                    58px,
                    9vw,
                    140px
                );

            white-space: nowrap;

            animation:
                announcementReveal
                2s
                ease-out
                1s
                both;
        }


        .announcement p {
            margin: 0;
        }


        /* ==================================================
           NEXT BUTTON
           ================================================== */

        .next-button {
            position: absolute;

            top: 82%;
            left: 80%;

            transform:
                translate(-50%, -50%);

            width: 5%;

            cursor: pointer;

            z-index: 20;

            animation:
                buttonEnter
                2s
                ease-out
                1.5s
                both;
        }


        .next-button img {
            display: block;

            width: 100%;
            height: auto;
        }


        /* ==================================================
           TAP TO OPEN OVERLAY
           ================================================== */

        .open-overlay {
            display: none;
        }


        /* ==================================================
           MOBILE VERSION
           ================================================== */

        @media (max-width: 600px) {


            html,
            body {
                margin: 0;
                padding: 0;

                width: 100%;
                min-height: 100%;

                background-color: black;
            }


            /* ==============================================
               FULL MOBILE SCREEN
               ============================================== */

            .page1 {
                position: relative;

                width: 100%;

                height: 100vh;
                height: 100svh;
                height: 100dvh;

                overflow: hidden;

                background-color: black;
            }


            /* ==============================================
               PHOTO FILLS ENTIRE PHONE
               ============================================== */

            .page1 > .main-photo {
                position: absolute;

                top: 0;
                left: 0;

                width: 100%;
                height: 100%;

                object-fit: cover;

                object-position:
                    center center;

                display: block;
            }


            /* ==============================================
               MOBILE OMAR
               ============================================== */

            .omar {
                top: 44.5%;
                left: 22%;

                font-size: 9vw;
            }


            /* ==============================================
               MOBILE AMPERSAND
               ============================================== */

            .ampersand {
                top: 48%;
                left: 49%;

                width: 7%;
            }


            /* ==============================================
               MOBILE NADA
               ============================================== */

            .nada {
                top: 53%;
                left: 50.5%;

                font-size: 9vw;
            }


            /* ==============================================
               MOBILE ANNOUNCEMENT
               ============================================== */

            .announcement {
                top: 64%;
                left: 14%;

                width: 70%;

                font-size: 9vw;
            }


            /* ==============================================
               MOBILE NEXT BUTTON

               EDIT THESE VALUES IF YOU WANT TO MOVE IT:

               top  = up/down
               left = left/right
               ============================================== */

            .next-button {
                top: 86%;
                left: 84%;

                width: 8%;

                z-index: 30;
            }


            /* ==============================================
               TAP TO OPEN OVERLAY
               ============================================== */

            .open-overlay {
                position: fixed;

                inset: 0;

                z-index: 9999;

                display: flex;

                align-items: center;
                justify-content: center;

                width: 100%;

                height: 100vh;
                height: 100svh;
                height: 100dvh;

                background-color: white;

                opacity: 1;

                cursor: pointer;

                -webkit-tap-highlight-color:
                    transparent;

                transition:
                    opacity
                    0.6s
                    ease;
            }


            .open-overlay-content {
                width: 90%;

                padding: 30px;

                text-align: center;
            }


            .open-overlay-text {
                margin: 0;

                color: #5a5b5e;

                font-family:
                    "Dream Avenue",
                    serif;

                font-weight: normal;

                font-size: 7vw;

                line-height: 1.35;

                letter-spacing: 0.08em;

                text-align: center;

                user-select: none;

                -webkit-user-select:
                    none;
            }


            .open-overlay.hidden {
                opacity: 0;

                pointer-events: none;
            }

        }


        /* ==================================================
           EXTRA SMALL PHONES
           ================================================== */

        @media (max-width: 380px) {

            .omar,
            .nada {
                font-size: 8.7vw;
            }


            .announcement {
                font-size: 8.7vw;
            }


            .next-button {
                top: 86%;
                left: 84%;

                width: 9%;
            }


            .open-overlay-text {
                font-size: 6.5vw;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         MOBILE TAP TO OPEN
         ================================================== -->

    <div
        class="open-overlay"
        id="openOverlay"
        role="button"
        tabindex="0"
        aria-label="Tap to open the invitation"
    >

        <div class="open-overlay-content">

            <p class="open-overlay-text">
                Tap to Open the Invitation
            </p>

        </div>

    </div>


    <!-- ==================================================
         PAGE 1
         ================================================== -->

    <section
        class="page1"
        id="page1"
    >


        <!-- MAIN PHOTO -->

        <img
            class="main-photo"
            src="images/couple.jpg"
            alt="Omar and Nada"
            fetchpriority="high"
        >


        <!-- OMAR -->

        <h1 class="omar">
            OMAR
        </h1>


        <!-- AMPERSAND -->

        <img
            class="ampersand"
            src="images/ampersand.png"
            alt="&"
        >


        <!-- NADA -->

        <h1 class="nada">
            NADA
        </h1>


        <!-- ANNOUNCEMENT -->

        <div class="announcement">

            <p>
                We are Happy to Announce
            </p>

        </div>


        <!-- NEXT BUTTON -->

        <a
            href="page2.html"
            class="next-button"
            id="nextButton"
            aria-label="Continue to invitation"
        >

            <img
                src="images/next-button.png"
                alt=""
            >

        </a>


    </section>


    <!-- ==================================================
         WEDDING MUSIC
         ================================================== -->

    <audio
        id="weddingMusic"
        src="music/wedding-music.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- ==================================================
         JAVASCRIPT
         ================================================== -->

    <script>

        const weddingMusic =
            document.getElementById(
                "weddingMusic"
            );


        const openOverlay =
            document.getElementById(
                "openOverlay"
            );


        const nextButton =
            document.getElementById(
                "nextButton"
            );


        weddingMusic.volume = 0.7;


        /* ==================================================
           RESTORE MUSIC POSITION
           ================================================== */

        const savedMusicTime =
            sessionStorage.getItem(
                "weddingMusicTime"
            );


        weddingMusic.addEventListener(

            "loadedmetadata",

            function () {

                if (
                    savedMusicTime !== null
                ) {

                    const restoredTime =
                        parseFloat(
                            savedMusicTime
                        );


                    if (
                        Number.isFinite(
                            restoredTime
                        )
                    ) {

                        weddingMusic.currentTime =
                            restoredTime;

                    }

                }

            },

            {
                once: true
            }

        );


        /* ==================================================
           START MUSIC
           ================================================== */

        function startWeddingMusic() {

            return weddingMusic.play();

        }


        /* ==================================================
           DESKTOP AUTOPLAY ATTEMPT
           ================================================== */

        if (
            window.matchMedia(
                "(min-width: 601px)"
            ).matches
        ) {

            startWeddingMusic()
                .catch(
                    function () {}
                );

        }


        /* ==================================================
           MOBILE TAP TO OPEN
           ================================================== */

        let invitationIsOpening =
            false;


        function openInvitation() {


            if (
                invitationIsOpening
            ) {

                return;

            }


            invitationIsOpening =
                true;


            /*
                IMPORTANT:

                play() happens directly inside
                the user's tap event.

                This gives mobile browsers the
                best chance of allowing audio.
            */

            const playPromise =
                startWeddingMusic();


            if (
                playPromise &&
                typeof playPromise.then ===
                "function"
            ) {

                playPromise

                    .then(

                        function () {


                            sessionStorage.setItem(
                                "weddingMusicStarted",
                                "true"
                            );


                            openOverlay
                                .classList
                                .add(
                                    "hidden"
                                );


                            setTimeout(

                                function () {

                                    openOverlay.style.display =
                                        "none";

                                },

                                650

                            );

                        }

                    )

                    .catch(

                        function () {


                            /*
                                Don't remove the overlay
                                if the browser refused
                                to start the music.
                            */

                            invitationIsOpening =
                                false;

                        }

                    );

            }

        }


        openOverlay.addEventListener(
            "click",
            openInvitation
        );


        openOverlay.addEventListener(

            "keydown",

            function (event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    openInvitation();

                }

            }

        );


        /* ==================================================
           DESKTOP CLICK FALLBACK
           ================================================== */

        if (
            window.matchMedia(
                "(min-width: 601px)"
            ).matches
        ) {

            function desktopMusicUnlock() {


                startWeddingMusic()

                    .then(

                        function () {

                            document
                                .removeEventListener(
                                    "click",
                                    desktopMusicUnlock
                                );

                        }

                    )

                    .catch(
                        function () {}
                    );

            }


            document.addEventListener(
                "click",
                desktopMusicUnlock
            );

        }


        /* ==================================================
           SAVE MUSIC POSITION
           ================================================== */

        setInterval(

            function () {

                if (
                    !weddingMusic.paused &&
                    Number.isFinite(
                        weddingMusic.currentTime
                    )
                ) {

                    sessionStorage.setItem(
                        "weddingMusicTime",
                        weddingMusic.currentTime
                    );

                }

            },

            250

        );


        /* ==================================================
           NEXT PAGE
           ================================================== */

        nextButton.addEventListener(

            "click",

            function (event) {


                event.preventDefault();


                if (
                    Number.isFinite(
                        weddingMusic.currentTime
                    )
                ) {

                    sessionStorage.setItem(
                        "weddingMusicTime",
                        weddingMusic.currentTime
                    );

                }


                sessionStorage.setItem(
                    "weddingMusicStarted",
                    "true"
                );


                window.location.href =
                    "page2.html";

            }

        );


        /* ==================================================
           SAVE BEFORE PAGE CLOSES
           ================================================== */

        window.addEventListener(

            "pagehide",

            function () {

                if (
                    Number.isFinite(
                        weddingMusic.currentTime
                    )
                ) {

                    sessionStorage.setItem(
                        "weddingMusicTime",
                        weddingMusic.currentTime
                    );

                }

            }

        );

    </script>


</body>

</html>
